name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Winndroid.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          Write-Host 'PowerShell syntax OK'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = '0.0.0-dev'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\Winndroid.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable archive
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item Winndroid.ps1, Winndroid.cmd, README.md, LICENSE, config.example.json $stage
          Copy-Item assets $stage -Recurse
          Copy-Item docs $stage -Recurse
          $zip = "dist\Winndroid-${{ steps.ver.outputs.version }}-portable.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Winndroid-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(
            "dist\Winndroid-Setup-${{ steps.ver.outputs.version }}.exe",
            "dist\Winndroid-${{ steps.ver.outputs.version }}-portable.zip"
          )
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Winndroid $tag" --generate-notes
          }
